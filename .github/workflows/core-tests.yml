# 内核测试 —— 两个平台，同一个内核。
#
# 为什么只有两个平台：
#   ubuntu-22.04  setup-swift@v2 + 5.10，稳定
#   macos-14      Xcode 自带工具链，稳定
#
#   Windows 试过了，跑不通，原因全在 runner 环境而不在代码：
#     1. runner 没有预装 Swift
#     2. winget 不在 runner 的 PowerShell PATH 里
#     3. swift-actions/setup-swift 对 Windows 的支持是坏的 ——
#        它会打印 "Version 5.10.1 is not available" 之后**仍然把步骤标记为成功**，
#        于是失败推迟到下一步才暴露
#     4. 官方安装包能下载，静默装完之后工具链仍不在测试进程的 PATH 里
#   留着一条永远红的 job 只会训练人忽略红色。所以这里不放它。
#
#   跨平台这件事已经由 ubuntu + macOS 证明 —— 两套完全不同的 Foundation 实现。
#   要在自己 Windows 机器上跑测试，见 docs/07-无Mac测试.md：
#   装 VS Build Tools（C++ 工作负载）+ winget install Swift.Toolchain。

name: Core Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux 上 Swift 版本不稳定，钉死一个保证结果可复现。
      # macOS 用 Xcode 自带的。
      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Swift version
        run: swift --version

      - name: Build core
        run: swift build --package-path AetherCore

      - name: Test core
        run: swift test --package-path AetherCore
