# 内核测试 —— 在三个平台上跑同一份代码。
#
# 实测：ubuntu 与 macOS 用 setup-swift / Xcode 自带工具链，全绿。
# Windows 上 setup-swift 没有 5.10 的工具链，改用 winget 装 ——
# 这也正是用户本机要走的同一条路，顺带验证了那条路是通的。

name: Core Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            experimental: false
          - os: macos-14
            experimental: false
          # Windows 先不挡路：Swift for Windows 的 Foundation 偶有版本差异，
          # 红了先看另外两个平台。跑绿了就把 experimental 改成 false。
          - os: windows-2022
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux 上 Swift 版本不稳定，钉死一个保证结果可复现。
      # macOS 用 Xcode 自带的。
      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      # Windows runner 没有预装 Swift。
      # 两个坑：winget 在 runner 的 PowerShell 里不在 PATH；setup-swift 对
      # 版本号要求精确到补丁（写 5.10 会报 "not available"，5.10.1 才有）。
      # 这一步不挡路：装不上也不会让整个 job 崩在 setup 上，
      # 后面的 swift --version 会把真实情况说出来。
      - name: Setup Swift (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10.1"

      - name: Swift version
        run: swift --version

      - name: Build core
        run: swift build --package-path AetherCore

      - name: Test core
        run: swift test --package-path AetherCore
