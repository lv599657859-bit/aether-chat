# 内核测试 —— 在三个平台上跑同一份代码。
#
# 这是「不装任何东西也能验证工程」的主力：push 上去就有结果。
# 内核包里没有一行 SwiftUI / UIKit / AVFoundation，所以它本来就该跨平台通过。
#
# 实测（2026-09-18）：ubuntu 与 macOS 全绿；Windows 需要额外装工具链，见下。

name: Core Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            experimental: false
          - os: macos-14
            experimental: false
          # Windows runner 没有预装 Swift，需要显式装一份。
          # 它先不挡路：万一 Swift for Windows 的 Foundation 有版本差异，
          # 红了也只当参考，不阻塞另外两个平台。
          - os: windows-2022
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux / Windows 上 Swift 版本不稳定，这里钉死一个，保证结果可复现。
      # macOS 用 Xcode 自带的。
      - name: Setup Swift
        if: runner.os != 'macOS'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Swift version
        run: swift --version

      - name: Build core
        run: swift build --package-path AetherCore

      - name: Test core
        run: swift test --package-path AetherCore
