# 云端构建 —— 没有 Mac 也能拿到可运行的产物。
#
# 产出两个东西：
#   1. AetherChat-simulator-app  模拟器包，只能在 macOS 模拟器里跑
#   2. AetherChat-unsigned-ipa   真机包（未签名），给 Sideloadly / AltStore
#                                在 Windows 上自签安装到 iPhone 用
#
# 注意：这个仓库的根目录**就是** AetherChat 工程目录，
# 所以所有路径都相对仓库根，不要再套一层 AetherChat/。

name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Simulator + unsigned IPA)
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # XcodeGen 会生成新版工程格式（objectVersion 77），
      # macos-14 默认的 Xcode 15.4 读不了它。这里显式切到最新稳定版 Xcode。
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ── 一、模拟器包 ─────────────────────────────────────────────
      # 只编译，不签名。没有 Apple 开发者账号也能跑。
      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project AetherChat.xcodeproj \
            -scheme AetherChat \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AetherChat-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator
          if-no-files-found: warn

      # ── 二、真机包（未签名）───────────────────────────────────────
      # 模拟器包装不进 iPhone，只有这一份 arm64 的真机构建才行。
      # 它没有签名 —— 签名由 Sideloadly / AltStore 在你自己的
      # Windows 电脑上用你的 Apple ID 完成。
      - name: Build for Device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AetherChat.xcodeproj \
            -scheme AetherChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log

      # IPA 就是「Payload/ 目录里放一个 .app，整体 zip」。
      # 不需要任何签名工具就能产出。
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DerivedDataDevice/Build/Products/Release-iphoneos/AetherChat.app"
          echo "检查 app 包: $APP"
          test -d "$APP"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../AetherChat-unsigned.ipa Payload
          cd ../..
          ls -lh build/AetherChat-unsigned.ipa

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AetherChat-unsigned-ipa
          path: build/AetherChat-unsigned.ipa
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build-device.log
          if-no-files-found: warn
