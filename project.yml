name: AetherChat
options:
  bundleIdPrefix: com.aether
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AetherChat:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AetherKit
      - path: Features
      # 内核源码直接编进 app 模块。
      #
      # 为什么不把它当成 SwiftPM 依赖：SwiftPM 库的符号默认是 internal，
      # 当成依赖就意味着要给内核里几乎每个类型、属性、方法，以及所有结构体的
      # 成员初始化器都加 public —— 几百处机械修改，漏一处就编不过。
      # 对「一个 app + 一套可独立测试的内核」这个规模来说，
      # 让它以两种方式存在（app 内联编译 / 独立包跑测试）代价更小。
      # 见 docs/07-无Mac测试.md。
      - path: AetherCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aether.chat
        PRODUCT_NAME: AetherChat
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 灵犀
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 用于给角色发送语音消息、以及和角色通话。
        NSSpeechRecognitionUsageDescription: 用于把你的语音转成文字，交给角色理解。
        NSCameraUsageDescription: 用于拍摄照片分享给角色。
        NSPhotoLibraryUsageDescription: 用于从相册选择照片分享给角色，以及保存角色发来的图片。
        NSPhotoLibraryAddUsageDescription: 用于把角色发来的日常照片保存到相册。
        NSFaceIDUsageDescription: 用于保护「潜意识层」隐私面板与人格宪章。
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.aether.chat.autonomy.refresh
          - com.aether.chat.autonomy.processing
        ITSAppUsesNonExemptEncryption: false

schemes:
  AetherChat:
    build:
      targets:
        AetherChat: all
    run:
      config: Debug
